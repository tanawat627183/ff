<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#181b20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%23181b20'/%3E%3Cpath d='M280 96L144 288h104l-24 128 144-192H264z' fill='%23ff8c00'/%3E%3C/svg%3E">
  <title>Panel & Piping Studio Pro - คุณเดียร์</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100dvh;
      background-color: #101216;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* แถบเครื่องมือด้านบน */
    .topbar {
      background: #181b20; padding: 6px 10px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2b303b; z-index: 30; gap: 6px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .brand h1 { font-size: 14px; margin: 0; color: #ff8c00; white-space: nowrap; }
    .tools { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .btn {
      background: #252a34; color: #e2e8f0; border: 1px solid #3a4150;
      padding: 5px 8px; border-radius: 6px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.active { border-color: #ff8c00; background: #3b2a1a; color: #ff8c00; font-weight: bold; }
    .btn-install { background: #b45309; border-color: #f59e0b; color: #fff; font-weight: bold; }
    .btn-save { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; font-weight: bold; }
    .btn-success { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
    .btn-danger { background: #4a1c1c; border-color: #7f2d2d; color: #fca5a5; }
    .color-dot {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid #444; cursor: pointer; flex-shrink: 0;
    }
    .color-dot.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 6px rgba(255,255,255,0.6); }

    /* แถบแจ้งเตือนสถานะการเดินสาย */
    .wire-banner {
      background: #2b1d0e; border-bottom: 1px solid #ff8c00; color: #fdba74;
      padding: 5px 12px; font-size: 12px; display: none;
      justify-content: space-between; align-items: center; z-index: 25; flex-shrink: 0; gap: 8px;
    }

    /* พื้นที่กระดานกริด */
    .workspace {
      flex: 1; position: relative; overflow: auto;
      background-color: #12151a;
      background-image: 
        linear-gradient(to right, #1c2028 1px, transparent 1px),
        linear-gradient(to bottom, #1c2028 1px, transparent 1px),
        linear-gradient(to right, #242933 1px, transparent 1px),
        linear-gradient(to bottom, #242933 1px, transparent 1px);
      background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    }
    svg#canvas { width: 2600px; height: 1800px; display: block; }
    .draggable-item, .wire-handle { touch-action: none; }

    /* เมนูลอยตั้งค่าอุปกรณ์ที่เลือก */
    .inspector {
      position: fixed; top: 52px; right: 10px;
      background: #1a1e24; border: 1px solid #ff8c00; border-radius: 10px;
      padding: 10px; display: none; flex-direction: column; gap: 7px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.85); z-index: 40; width: 225px;
      max-height: calc(100dvh - 145px); overflow-y: auto;
    }
    .inspector-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: bold; color: #ff8c00; border-bottom: 1px solid #2e3440; padding-bottom: 5px;
    }
    .inspector label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
    .inspector select, .inspector input, .inspector button {
      padding: 5px 8px; border-radius: 5px; background: #262b36; color: #fff;
      border: 1px solid #3f4756; font-size: 12px; width: 100%;
    }
    .inspector .row-btns { display: flex; gap: 5px; }
    .inspector .row-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 5px; }

    /* แผงลูกศร D-Pad */
    .dpad-box {
      background: #14171c; border: 1px solid #2e3440; border-radius: 8px; padding: 6px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .dpad-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center;
    }
    .dpad-btn {
      background: #2a303c !important; border: 1px solid #475569 !important;
      padding: 7px 0 !important; font-size: 14px !important; font-weight: bold;
      cursor: pointer; border-radius: 6px;
    }
    .dpad-btn:active { background: #ff8c00 !important; color: #000 !important; }

    /* แถบหมวดหมู่และคลังอุปกรณ์ด้านล่าง */
    .bottom-panel {
      background: #181b20; border-top: 1px solid #2b303b; z-index: 30;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .cat-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #14171c; border-bottom: 1px solid #2b303b; padding: 4px 8px 0;
    }
    .cat-tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; }
    .cat-tab {
      padding: 5px 10px; font-size: 12px; color: #94a3b8; cursor: pointer;
      border-radius: 6px 6px 0 0; white-space: nowrap; border: 1px solid transparent;
    }
    .cat-tab.active {
      background: #181b20; color: #ff8c00; font-weight: bold;
      border-color: #2b303b; border-bottom-color: #181b20;
    }
    .dock {
      padding: 8px 10px; display: flex; gap: 8px; overflow-x: auto; align-items: center; height: 74px;
    }
    .dock.collapsed { display: none; }
    .dock-item {
      background: #222730; border: 1px solid #353c49; border-radius: 8px;
      padding: 6px 10px; min-width: 92px; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .dock-item:active { background: #313846; border-color: #ff8c00; transform: scale(0.95); }
    .dock-item .icon { font-size: 18px; line-height: 1.1; }
    .dock-item span { font-size: 11px; color: #cbd5e1; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <h1>⚡ Panel Studio</h1>
      <button id="installBtn" class="btn btn-install" onclick="installPWA()">📲 ติดตั้ง</button>
      <button class="btn" onclick="toggleScreenOrientation()" title="สลับแนวตั้ง/แนวนอน">🔄 พลิกจอ</button>
      <button id="undoBtn" class="btn" onclick="undo()" title="ย้อนกลับ">↩️</button>
      <button id="redoBtn" class="btn" onclick="redo()" title="ทำซ้ำ">↪️</button>
    </div>
    <div class="tools">
      <button id="modeSelect" class="btn active" onclick="setMode('select')">✋ ย้าย/เลือก</button>
      <button id="modeWire" class="btn" onclick="setMode('wire')">〰️ เดินสายอิสระ</button>
      <div class="color-dot selected" style="background:#8B4513;" title="L (น้ำตาล)" onclick="setWireColor('#8B4513', this)"></div>
      <div class="color-dot" style="background:#1E90FF;" title="N (ฟ้า)" onclick="setWireColor('#1E90FF', this)"></div>
      <div class="color-dot" style="background:#2ecc71;" title="G (เขียว)" onclick="setWireColor('#2ecc71', this)"></div>
      <div class="color-dot" style="background:#e74c3c;" title="L1/Control (แดง)" onclick="setWireColor('#e74c3c', this)"></div>
      <div class="color-dot" style="background:#f1c40f;" title="L2 (เหลือง)" onclick="setWireColor('#f1c40f', this)"></div>
      <div class="color-dot" style="background:#111111; border-color:#777;" title="L3/COM (ดำ)" onclick="setWireColor('#111111', this)"></div>
      <button class="btn btn-save" onclick="exportToPNG()">📸 บันทึกภาพ</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️</button>
    </div>
  </div>

  <!-- Wire Drawing Helper Banner -->
  <div id="wireBanner" class="wire-banner">
    <span>📍 แตะจุดเริ่ม -> แตะมุมเลี้ยวได้เรื่อยๆ -> แตะหัวน็อตปลายทางเพื่อจบ</span>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-success" onclick="finishCurrentWire()">✅ จบเส้นนี้</button>
      <button class="btn btn-danger" onclick="cancelCurrentWire()">ยกเลิก</button>
    </div>
  </div>

  <!-- Inspector Menu -->
  <div id="inspector" class="inspector">
    <div class="inspector-header">
      <span id="inspTitle">ตั้งค่าอุปกรณ์</span>
      <span style="cursor:pointer; color:#94a3b8; padding:0 4px;" onclick="closeInspector()">✕</span>
    </div>

    <!-- แผงปุ่มลูกศรเลื่อนตำแหน่ง -->
    <div class="dpad-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; color:#94a3b8;">ปุ่มลูกศรเลื่อน:</span>
        <select id="nudgeStep" style="width:auto; padding:2px 4px; font-size:11px;">
          <option value="20">1 ช่อง (20px)</option>
          <option value="5">ละเอียด (5px)</option>
        </select>
      </div>
      <div class="dpad-grid">
        <div></div>
        <button class="dpad-btn" onclick="nudgeSelected(0, -1)">⬆️</button>
        <div></div>
        <button class="dpad-btn" onclick="nudgeSelected(-1, 0)">⬅️</button>
        <button class="dpad-btn" onclick="nudgeSelected(0, 1)">⬇️</button>
        <button class="dpad-btn" onclick="nudgeSelected(1, 0)">➡️</button>
      </div>
    </div>

    <!-- ตั้งค่าท่อ: ขนาดหุน และ ความยาว (เมตร / เซน / หุน) -->
    <div id="pipeSpecGroup" style="display:none; flex-direction:column; gap:6px;">
      <div>
        <label>ขนาดท่อ (หุน / นิ้ว):</label>
        <select id="pipeSizeSelect" onchange="updateDeviceProp('pipeSize', this.value)">
          <option value="3 หุน">3 หุน (3/8" - 16มม.)</option>
          <option value="4 หุน">4 หุน (1/2" - 20มม.)</option>
          <option value="6 หุน">6 หุน (3/4" - 25มม.)</option>
          <option value="1 นิ้ว">1 นิ้ว (8 หุน - 32มม.)</option>
          <option value="1.25 นิ้ว">1 นิ้ว 2 หุน (1-1/4")</option>
          <option value="1.5 นิ้ว">1 นิ้วครึ่ง (1-1/2")</option>
          <option value="2 นิ้ว">2 นิ้ว (50มม.)</option>
        </select>
      </div>
      <div id="pipeLenBox">
        <label>ความยาวท่อ / ราง:</label>
        <div class="row-2">
          <input type="number" id="pipeLenInput" step="0.1" min="0.1" value="1" oninput="updatePipeLength()">
          <select id="pipeUnitSelect" onchange="updatePipeLength()">
            <option value="เมตร">เมตร (ม.)</option>
            <option value="เซนติเมตร">เซน (ซม.)</option>
            <option value="หุน">หุน</option>
          </select>
        </div>
      </div>
    </div>

    <div id="ampGroup">
      <label>ขนาดแอมป์ / พิกัด:</label>
      <select id="ampSelect" onchange="updateDeviceProp('amp', this.value)">
        <option value="C100">C100 (100A)</option>
        <option value="C63">C63 (63A)</option>
        <option value="C50">C50 (50A)</option>
        <option value="C40">C40 (40A)</option>
        <option value="C32">C32 (32A)</option>
        <option value="C25">C25 (25A)</option>
        <option value="C20">C20 (20A)</option>
        <option value="C16">C16 (16A)</option>
        <option value="C10">C10 (10A)</option>
        <option value="C6">C6 (6A)</option>
      </select>
    </div>

    <div id="colorGroup" style="display:none;">
      <label>สีอุปกรณ์ / ปลอกไวนัส:</label>
      <select id="lampColorSelect" onchange="updateDeviceProp('color', this.value)">
        <option value="#2ecc71">สีเขียว (RUN / G)</option>
        <option value="#e74c3c">สีแดง (STOP / L1)</option>
        <option value="#facc15">สีเหลือง (WARN / ปลอกไวนัส)</option>
        <option value="#3498db">สีฟ้า (INFO / N)</option>
        <option value="#f8fafc">สีขาว (มาร์คสาย)</option>
      </select>
    </div>

    <div id="textGroup">
      <label>ป้ายชื่อ / มาร์คสาย:</label>
      <input type="text" id="labelInput" placeholder="เช่น L1, ท่อเมนปั๊ม" oninput="updateDeviceProp('label', this.value)">
    </div>

    <div id="widthGroup" style="display:none;">
      <label>จำนวนช่องราง / บัสบาร์:</label>
      <select id="slotSelect" onchange="updateDeviceProp('slots', parseInt(this.value))">
        <option value="4">4 ช่อง</option>
        <option value="6">6 ช่อง</option>
        <option value="8">8 ช่อง</option>
        <option value="12">12 ช่อง</option>
        <option value="16">16 ช่อง</option>
        <option value="20">20 ช่อง</option>
      </select>
    </div>

    <div class="row-btns">
      <button onclick="rotateSelected(45)">🔄 หมุน 45°</button>
      <button onclick="rotateSelected(90)">🔄 หมุน 90°</button>
    </div>
    <div class="row-btns">
      <button onclick="toggleDeviceState()">⚡ ON/OFF</button>
      <button onclick="duplicateSelected()">📋 คัดลอก</button>
    </div>
    <button class="btn-danger" onclick="deleteSelected()">🗑️ ลบอุปกรณ์นี้</button>
  </div>

  <!-- Main Grid Canvas -->
  <div class="workspace" id="workspace">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="pipes-layer"></g>
      <g id="rails-layer"></g>
      <g id="devices-layer"></g>
      <g id="wires-layer"></g>
      <g id="terminals-layer"></g>
    </svg>
  </div>

  <!-- Bottom Category & Component Dock -->
  <div class="bottom-panel">
    <div class="cat-bar">
      <div class="cat-tabs" id="catTabs"></div>
      <button class="btn" style="padding:3px 8px; margin-bottom:3px;" onclick="toggleDock()" id="dockToggleBtn">🔽 ซ่อนแถบ</button>
    </div>
    <div class="dock" id="componentDock"></div>
  </div>

<script>
  // --- ระบบติดตั้ง PWA & สลับแนวตั้ง/แนวนอน ---
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  if (window.matchMedia('(display-mode: standalone)').matches) {
    installBtn.style.display = 'none';
  }

  async function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    } else {
      alert('วิธีติดตั้งลงหน้าจอหลัก MatePad:\n\n1. แตะปุ่มจุด 3 จุด (⋮) มุมขวาบนของเบราว์เซอร์\n2. เลือก "เพิ่มลงในหน้าจอหลัก" (Add to Home screen)\n3. แนะนำเปิดผ่าน Kiwi Browser จะได้ทางลัดที่หมุนจอตามมือได้อิสระ 100% ครับ');
    }
  }

  let screenModeState = 'auto'; // 'auto' | 'portrait' | 'landscape'
  async function toggleScreenOrientation() {
    try {
      if (screenModeState === 'auto' || screenModeState === 'landscape') {
        await screen.orientation.lock('portrait');
        screenModeState = 'portrait';
      } else {
        await screen.orientation.lock('landscape');
        screenModeState = 'landscape';
      }
    } catch (err) {
      try {
        screen.orientation.unlock();
        screenModeState = 'auto';
        alert('ปลดล็อกการหมุนจอแล้วครับ เอียงเครื่องเพื่อหมุนจอได้เลย (หากใช้ตัวติดตั้งจาก Chrome บน MatePad แนะนำลบออกแล้วเพิ่มทางลัดผ่าน Kiwi Browser แทนครับ)');
      } catch (e) {
        alert('ให้ลองลบแอพเดิมออก แล้วเปิดเว็บนี้ผ่าน Kiwi Browser กด "เพิ่มลงในหน้าจอหลัก" จะหมุนจอตามมือได้ 100% ครับ');
      }
    }
  }

  // --- ระบบหลักของแอพ ---
  const GRID = 20;
  let mode = 'select';
  let wireColor = '#8B4513';
  let activeCategory = 'pipes';
  let devices = [];
  let wires = [];
  let selectedDeviceId = null;
  let selectedWireIdx = null;
  let activeWirePoints = [];

  let dragState = {
    type: null,
    target: null,
    domEl: null,
    pointerId: null,
    startX: 0,
    startY: 0,
    origX: 0,
    origY: 0,
    hasMoved: false
  };

  let historyStack = [];
  let redoStack = [];

  const PIPE_THICKNESS = {
    '3 หุน': 16,
    '4 หุน': 20,
    '6 หุน': 26,
    '1 นิ้ว': 32,
    '1.25 นิ้ว': 38,
    '1.5 นิ้ว': 44,
    '2 นิ้ว': 52
  };

  const CATALOG = {
    pipes: {
      name: '🪠 ท่อ & รางเดินสาย',
      items: [
        { type: 'pipe_pvc', name: 'ท่อ PVC เหลือง', icon: '🟡', pipeSize: '4 หุน', pipeLen: 1.5, pipeUnit: 'เมตร' },
        { type: 'pipe_upvc', name: 'ท่อ uPVC ขาว', icon: '⚪', pipeSize: '4 หุน', pipeLen: 1.5, pipeUnit: 'เมตร' },
        { type: 'pipe_emt', name: 'ท่อ EMT โลหะ', icon: '🩶', pipeSize: '4 หุน', pipeLen: 1.5, pipeUnit: 'เมตร' },
        { type: 'pipe_imc', name: 'ท่อ IMC หนา', icon: '🔩', pipeSize: '6 หุน', pipeLen: 1.5, pipeUnit: 'เมตร' },
        { type: 'pipe_flex', name: 'ท่ออ่อนลูกฟูก', icon: '〰️', pipeSize: '4 หุน', pipeLen: 50, pipeUnit: 'เซนติเมตร' },
        { type: 'pipe_liquid', name: 'ท่ออ่อนกันน้ำ', icon: '🐍', pipeSize: '4 หุน', pipeLen: 50, pipeUnit: 'เซนติเมตร' },
        { type: 'wireway', name: 'รางไวร์เวย์โปร่ง', icon: '🪜', pipeSize: '1 นิ้ว', pipeLen: 1, pipeUnit: 'เมตร' },
        { type: 'wire_duct', name: 'รางครอบสายไฟ', icon: '▭', pipeSize: '1 นิ้ว', pipeLen: 1, pipeUnit: 'เมตร' }
      ]
    },
    fittings: {
      name: '↪️ ข้อต่อ & บ็อกซ์',
      items: [
        { type: 'elbow90', name: 'ข้องอ 90°', icon: '↪️', pipeSize: '4 หุน' },
        { type: 'sweep_bend', name: 'ข้องอโค้ง 90°', icon: '⤴️', pipeSize: '4 หุน' },
        { type: 'elbow45', name: 'ข้องอ 45°', icon: '📐', pipeSize: '4 หุน' },
        { type: 'tee_pipe', name: 'สามทาง (Tee)', icon: '⊥', pipeSize: '4 หุน' },
        { type: 'cross_pipe', name: 'สี่ทาง (Cross)', icon: '➕', pipeSize: '4 หุน' },
        { type: 'coupling', name: 'ข้อต่อตรง', icon: '🔗', pipeSize: '4 หุน' },
        { type: 'box_conn', name: 'คอนเนคเตอร์เข้าตู้', icon: '🔌', pipeSize: '4 หุน' },
        { type: 'clamp', name: 'แคลมป์ก้ามปูรัดท่อ', icon: '🧲', pipeSize: '4 หุน' },

  const pipesLayer = document.getElementById('pipes-layer');
  const railsLayer = document.getElementById('rails-layer');
  const devicesLayer = document.getElementById('devices-layer');
  const wiresLayer = document.getElementById('wires-layer');
  const terminalsLayer = document.getElementById('terminals-layer');
  const inspector = document.getElementById('inspector');
  const canvas = document.getElementById('canvas');

  window.addEventListener('pointermove', (e) => {
    if (!dragState.type) return;
    if (dragState.pointerId !== null && e.pointerId !== dragState.pointerId) return;
    e.preventDefault();

    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;

    if (!dragState.hasMoved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
      dragState.hasMoved = true;
      pushHistory();
    }

    if (dragState.hasMoved) {
      const nextX = Math.max(0, snap(dragState.origX + dx));
      const nextY = Math.max(0, snap(dragState.origY + dy));

      if (dragState.type === 'device' && dragState.target && dragState.domEl) {
        dragState.target.x = nextX;
        dragState.target.y = nextY;
        const rot = dragState.target.rot || 0;
        dragState.domEl.setAttribute('transform', `translate(${nextX}, ${nextY}) rotate(${rot})`);
      } else if (dragState.type === 'wireNode' && dragState.target && dragState.domEl) {
        dragState.target.x = nextX;
        dragState.target.y = nextY;
        dragState.domEl.setAttribute('cx', nextX);
        dragState.domEl.setAttribute('cy', nextY);
        renderWiresOnly();
      }
    }
  }, { passive: false });

  const endDrag = (e) => {
    if (!dragState.type) return;
    if (dragState.pointerId !== null && e.pointerId !== dragState.pointerId) return;
    const wasMoved = dragState.hasMoved;
    dragState.type = null;
    dragState.target = null;
    dragState.domEl = null;
    dragState.pointerId = null;
    if (wasMoved) {
      saveData();
      render();
    }
  };

  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function startDeviceDrag(e, dev, gEl) {
    if (mode !== 'select') return;
    e.stopPropagation();

    const isAlreadySelected = selectedDeviceId === dev.id;
    selectedDeviceId = dev.id;
    selectedWireIdx = null;
    showInspector(dev);

    dragState = {
      type: 'device',
      target: dev,
      domEl: gEl,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      origX: dev.x,
      origY: dev.y,
      hasMoved: false
    };

    if (!isAlreadySelected) {
      render();
      const freshEl = document.getElementById('el_' + dev.id);
      if (freshEl) dragState.domEl = freshEl;
    }
  }

  function startWireNodeDrag(e, pt, circleEl) {
    e.stopPropagation();
    dragState = {
      type: 'wireNode',
      target: pt,
      domEl: circleEl,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      origX: pt.x,
      origY: pt.y,
      hasMoved: false
    };
  }

  function nudgeSelected(dirX, dirY) {
    const step = parseInt(document.getElementById('nudgeStep').value) || 20;
    if (selectedDeviceId) {
      const dev = devices.find(d => d.id === selectedDeviceId);
      if (dev) {
        pushHistory();
        dev.x = Math.max(0, dev.x + dirX * step);
        dev.y = Math.max(0, dev.y + dirY * step);
        saveData();
        render();
      }
    }
  }

  function exportToPNG() {
    if (devices.length === 0 && wires.length === 0) {
      alert('ยังไม่มีอุปกรณ์บนกระดานให้บันทึกครับ');
      return;
    }

    let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
    devices.forEach(d => {
      minX = Math.min(minX, d.x - 40);
      minY = Math.min(minY, d.y - 40);
      maxX = Math.max(maxX, d.x + 350);
      maxY = Math.max(maxY, d.y + 260);
    });
    wires.forEach(w => {
      w.points.forEach(p => {
        minX = Math.min(minX, p.x - 40);
        minY = Math.min(minY, p.y - 40);
        maxX = Math.max(maxX, p.x + 60);
        maxY = Math.max(maxY, p.y + 60);
      });
    });

    minX = Math.max(0, minX);
    minY = Math.max(0, minY);
    const width = Math.max(400, maxX - minX);
    const height = Math.max(300, maxY - minY);

    const cloneSvg = canvas.cloneNode(true);
    cloneSvg.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
    cloneSvg.setAttribute('width', width);
    cloneSvg.setAttribute('height', height);

    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', minX);
    bgRect.setAttribute('y', minY);
    bgRect.setAttribute('width', width);
    bgRect.setAttribute('height', height);
    bgRect.setAttribute('fill', '#12151a');
    cloneSvg.insertBefore(bgRect, cloneSvg.firstChild);

    const svgData = new XMLSerializer().serializeToString(cloneSvg);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = width * 2;
      exportCanvas.height = height * 2;
      const ctx = exportCanvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);

      exportCanvas.toBlob((blob) => {
        const link = document.createElement('a');
        const ts = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
        link.download = `panel-diagram-${ts}.png`;
        link.href = URL.createObjectURL(blob);
        link.click();
      }, 'image/png');
    };
    img.src = url;
  }

  function pushHistory() {
    historyStack.push(JSON.stringify({ devices, wires }));
    if (historyStack.length > 50) historyStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function undo() {
    if (historyStack.length === 0) return;
    redoStack.push(JSON.stringify({ devices, wires }));
    const prev = JSON.parse(historyStack.pop());
    devices = prev.devices;
    wires = prev.wires;
    closeInspector();
    saveData();
    render();
    updateHistoryButtons();
  }

  function redo() {
    if (redoStack.length === 0) return;
    historyStack.push(JSON.stringify({ devices, wires }));
    const next = JSON.parse(redoStack.pop());
    devices = next.devices;
    wires = next.wires;
    closeInspector();
    saveData();
    render();
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = historyStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }

  function initUI() {
    const catTabs = document.getElementById('catTabs');
    catTabs.innerHTML = '';
    Object.keys(CATALOG).forEach(key => {
      const tab = document.createElement('div');
      tab.className = 'cat-tab' + (key === activeCategory ? ' active' : '');
      tab.textContent = CATALOG[key].name;
      tab.onclick = () => {
        activeCategory = key;
        document.getElementById('componentDock').classList.remove('collapsed');
        document.getElementById('dockToggleBtn').textContent = '🔽 ซ่อนแถบ';
        initUI();
      };
      catTabs.appendChild(tab);
    });

    const dock = document.getElementById('componentDock');
    dock.innerHTML = '';
    CATALOG[activeCategory].items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'dock-item';
      card.innerHTML = `<div class="icon">${item.icon}</div><span>${item.name}</span>`;
      card.onclick = () => addDevice(item);
      dock.appendChild(card);
    });
  }

  function toggleDock() {
    const dock = document.getElementById('componentDock');
    const btn = document.getElementById('dockToggleBtn');
    const isHidden = dock.classList.toggle('collapsed');
    btn.textContent = isHidden ? '🔼 เปิดคลัง' : '🔽 ซ่อนแถบ';
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('modeSelect').classList.toggle('active', mode === 'select');
    document.getElementById('modeWire').classList.toggle('active', mode === 'wire');
    document.getElementById('wireBanner').style.display = mode === 'wire' ? 'flex' : 'none';
    activeWirePoints = [];
    selectedWireIdx = null;
    if (mode === 'wire') closeInspector();
    render();
  }

  function setWireColor(color, el) {
    wireColor = color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
  }

  function snap(val) { return Math.round(val / GRID) * GRID; }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = snap(e.clientX - rect.left);
    const clickY = snap(e.clientY - rect.top);

    if (mode === 'wire') {
      activeWirePoints.push({ x: clickX, y: clickY });
      render();
    } else if (e.target.id === 'canvas') {
      closeInspector();
      selectedWireIdx = null;
      render();
    }
  });

  function finishCurrentWire() {
    if (activeWirePoints.length >= 2) {
      pushHistory();
      wires.push({ points: [...activeWirePoints], color: wireColor });
      saveData();
    }
    activeWirePoints = [];
    render();
  }

  function cancelCurrentWire() {
    activeWirePoints = [];
    render();
  }

  function addDevice(itemSpec) {
    pushHistory();
    const ws = document.getElementById('workspace');
    const spawnX = snap(ws.scrollLeft + 100 + (devices.length % 5) * 40);
    const spawnY = snap(ws.scrollTop + 100 + (devices.length % 4) * 40);

    const newDev = {
      id: 'dev_' + Date.now() + Math.random().toString(36).substr(2, 4),
      type: itemSpec.type,
      name: itemSpec.name,
      x: spawnX,
      y: spawnY,
      rot: 0,
      amp: itemSpec.defaultAmp || 'C32',
      color: itemSpec.defaultColor || '#2ecc71',
      slots: itemSpec.defaultSlots || 6,
      pipeSize: itemSpec.pipeSize || '4 หุน',
      pipeLen: itemSpec.pipeLen || 1,
      pipeUnit: itemSpec.pipeUnit || 'เมตร',
      label: itemSpec.defaultLabel || '',
      isOn: true
    };
    devices.push(newDev);
    selectedDeviceId = newDev.id;
    showInspector(newDev);
    saveData();
    render();
  }

  function getPipePixelLength(dev) {
    const len = parseFloat(dev.pipeLen) || 1;
    const unit = dev.pipeUnit || 'เมตร';
    let px = 160;
    if (unit === 'เมตร') px = len * 160;
    else if (unit === 'เซนติเมตร') px = len * 2.4;
    else if (unit === 'หุน') px = len * 20;
    return Math.max(40, Math.min(1200, snap(px)));
  }

  function renderWiresOnly() {
    wiresLayer.innerHTML = '';
    wires.forEach((w, idx) => {
      if (!w.points || w.points.length < 2) return;
      const d = w.points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const isWireSelected = selectedWireIdx === idx;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', isWireSelected ? '#ff8c00' : w.color);
      path.setAttribute('stroke-width', isWireSelected ? '7' : '5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('fill', 'none');
      path.style.cursor = 'pointer';

      path.onclick = (e) => {
        e.stopPropagation();
        if (mode === 'select') {
          selectedWireIdx = idx;
          closeInspector();
          render();
        }
      };
      wiresLayer.appendChild(path);
    });
  }

  function render() {
    pipesLayer.innerHTML = '';
    railsLayer.innerHTML = '';
    devicesLayer.innerHTML = '';
    terminalsLayer.innerHTML = '';
    renderWiresOnly();

    if (selectedWireIdx !== null && mode === 'select' && wires[selectedWireIdx]) {
      const w = wires[selectedWireIdx];
      w.points.forEach((pt) => {
        const handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        handle.setAttribute('class', 'wire-handle');
        handle.setAttribute('cx', pt.x);
        handle.setAttribute('cy', pt.y);
        handle.setAttribute('r', '10');
        handle.setAttribute('fill', '#ff8c00');
        handle.setAttribute('stroke', '#fff');
        handle.setAttribute('stroke-width', '2');
        handle.style.cursor = 'move';
        handle.addEventListener('pointerdown', (e) => startWireNodeDrag(e, pt, handle));
        terminalsLayer.appendChild(handle);
      });

      const midPt = w.points[Math.floor(w.points.length / 2)];
      const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      delBtn.setAttribute('transform', `translate(${midPt.x}, ${midPt.y - 24})`);
      delBtn.style.cursor = 'pointer';
      delBtn.innerHTML = `
        <rect x="-26" y="-12" width="52" height="22" rx="4" fill="#dc2626" stroke="#fff"/>
        <text x="0" y="3" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ลบสาย</text>
      `;
      delBtn.onclick = (e) => {
        e.stopPropagation();
        pushHistory();
        wires.splice(selectedWireIdx, 1);
        selectedWireIdx = null;
        saveData();
        render();
      };
      terminalsLayer.appendChild(delBtn);
    }

    if (activeWirePoints.length > 0) {
      const d = activeWirePoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const preview = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      preview.setAttribute('d', d);
      preview.setAttribute('stroke', wireColor);
      preview.setAttribute('stroke-width', '5');
      preview.setAttribute('stroke-dasharray', '8,6');
      preview.setAttribute('fill', 'none');
      wiresLayer.appendChild(preview);

      activeWirePoints.forEach(pt => {
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', pt.x);
        dot.setAttribute('cy', pt.y);
        dot.setAttribute('r', '6');
        dot.setAttribute('fill', '#ff8c00');
        terminalsLayer.appendChild(dot);
      });
    }

    devices.forEach(dev => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', 'el_' + dev.id);
      g.setAttribute('class', 'draggable-item');
      const rot = dev.rot || 0;
      g.setAttribute('transform', `translate(${dev.x}, ${dev.y}) rotate(${rot})`);
      g.style.cursor = mode === 'select' ? 'grab' : 'default';

      const isSelected = dev.id === selectedDeviceId;
      const stroke = isSelected ? '#ff8c00' : '#222';
      const sw = isSelected ? 3 : 1.5;

      let pins = [];
      let targetLayer = devicesLayer;
      const thick = PIPE_THICKNESS[dev.pipeSize || '4 หุน'] || 20;

      switch (dev.type) {
        case 'pipe_pvc':
        case 'pipe_upvc':
        case 'pipe_emt':
        case 'pipe_imc':
        case 'pipe_flex':
        case 'pipe_liquid':
        case 'wireway':
        case 'wire_duct': {
          const w = getPipePixelLength(dev);
          const styles = {
            pipe_pvc: { fill: '#eab308', hi: '#fef08a', tag: 'PVC' },
            pipe_upvc: { fill: '#f8fafc', hi: '#cbd5e1', tag: 'uPVC' },
            pipe_emt: { fill: '#94a3b8', hi: '#e2e8f0', tag: 'EMT' },
            pipe_imc: { fill: '#64748b', hi: '#cbd5e1', tag: 'IMC' },
            pipe_flex: { fill: '#475569', hi: '#1e293b', tag: 'FLEX' },
            pipe_liquid: { fill: '#1e293b', hi: '#334155', tag: 'LIQ-FLEX' },
            wireway: { fill: '#334155', hi: '#0f172a', tag: 'WIREWAY' },
            wire_duct: { fill: '#cbd5e1', hi: '#94a3b8', tag: 'DUCT' }
          };
          const st = styles[dev.type];
          const specText = `${st.tag} ${dev.pipeSize} • ${dev.pipeLen} ${dev.pipeUnit === 'เซนติเมตร' ? 'ซม.' : (dev.pipeUnit === 'เมตร' ? 'ม.' : 'หุน')}${dev.label ? ' ('+dev.label+')' : ''}`;

          let extra = '';
          if (dev.type === 'pipe_flex' || dev.type === 'pipe_liquid') {
            for (let rx = 6; rx < w - 4; rx += 8) {
              extra += `<line x1="${rx}" y1="0" x2="${rx}" y2="${thick}" stroke="${st.hi}" stroke-width="2.5"/>`;
            }
          } else if (dev.type === 'wireway') {
            for (let rx = 8; rx < w - 12; rx += 18) {
              extra += `<rect x="${rx}" y="4" width="9" height="${thick - 8}" fill="#0f172a"/>`;
            }
          } else {
            extra = `<line x1="0" y1="${thick*0.28}" x2="${w}" y2="${thick*0.28}" stroke="${st.hi}" stroke-width="2" opacity="0.6"/>`;
          }

          g.innerHTML = `
            <rect x="0" y="0" width="${w}" height="${thick}" rx="3" fill="${st.fill}" stroke="${stroke}" stroke-width="${sw}"/>

        case 'wall_switch': {
          g.innerHTML = `
            <rect x="0" y="0" width="60" height="80" rx="6" fill="#f8fafc" stroke="${stroke}" stroke-width="${sw}"/>
            <rect x="18" y="18" width="24" height="44" rx="3" fill="${dev.isOn ? '#cbd5e1' : '#94a3b8'}" stroke="#64748b"/>
            ${drawScrew(20, -12)} ${drawScrew(40, -12)}
            ${drawBadge(30, 94, dev.label)}
          `;
          pins = [{dx:20,dy:-12},{dx:40,dy:-12}];
          break;
        }
        case 'water_pump':
        case 'air_pump':
        case 'heater':
        case 'float_switch':
        case 'solenoid': {
          const map = {
            water_pump: { bg: '#0284c7', title: '💧 ปั๊มน้ำ' },
            air_pump: { bg: '#0d9488', title: '🫧 ปั๊มลม' },
            heater: { bg: '#dc2626', title: '🔥 ฮีตเตอร์' },
            float_switch: { bg: '#d97706', title: '🎈 ลูกลอย' },
            solenoid: { bg: '#4f46e5', title: '🚰 โซลินอยด์' }
          };
          const info = map[dev.type];
          g.innerHTML = `
            <rect x="0" y="0" width="110" height="60" rx="10" fill="${info.bg}" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="55" y="28" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">${info.title}</text>
            <text x="55" y="46" fill="#e0f2fe" font-size="11" text-anchor="middle">${dev.label || '220V'}</text>
            ${drawScrew(35, -12)} ${drawScrew(75, -12)}
          `;
          pins = [{dx:35,dy:-12},{dx:75,dy:-12}];
          break;
        }
        case 'vinus_tag': {
          const text = dev.label || 'L1';
          const bg = dev.color || '#facc15';
          const textColor = ['#111111', '#e74c3c', '#3498db', '#2ecc71'].includes(bg) ? '#fff' : '#000';
          g.innerHTML = `
            <rect x="0" y="0" width="34" height="22" rx="4" fill="${bg}" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="17" y="15" fill="${textColor}" font-size="11" font-weight="bold" text-anchor="middle">${text}</text>
          `;
          break;
        }
        case 'label_tag': {
          const text = dev.label || 'ป้ายชื่อวงจร';
          const w = Math.max(80, text.length * 10 + 24);
          g.innerHTML = `
            <rect x="0" y="0" width="${w}" height="28" rx="4" fill="#facc15" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="${w/2}" y="19" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">${text}</text>
          `;
          break;
        }
      }

      createTerminalPoints(dev, pins);
      g.addEventListener('pointerdown', (e) => startDeviceDrag(e, dev, g));
      targetLayer.appendChild(g);
    });
  }

  function drawScrew(cx, cy) {
    return `
      <circle cx="${cx}" cy="${cy}" r="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <line x1="${cx-3.5}" y1="${cy-3.5}" x2="${cx+3.5}" y2="${cy+3.5}" stroke="#334155" stroke-width="1.8"/>
      <line x1="${cx+3.5}" y1="${cy-3.5}" x2="${cx-3.5}" y2="${cy+3.5}" stroke="#334155" stroke-width="1.8"/>
    `;
  }

  function drawBadge(cx, cy, text) {
    if (!text) return '';
    const w = text.length * 8 + 14;
    return `
      <rect x="${cx - w/2}" y="${cy - 11}" width="${w}" height="16" rx="3" fill="#facc15"/>
      <text x="${cx}" y="${cy + 1}" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">${text}</text>
    `;
  }

  function createTerminalPoints(dev, points) {
    if (mode !== 'wire') return;
    const rad = ((dev.rot || 0) * Math.PI) / 180;
    points.forEach(pt => {
      const rotX = pt.dx * Math.cos(rad) - pt.dy * Math.sin(rad);
      const rotY = pt.dx * Math.sin(rad) + pt.dy * Math.cos(rad);
      const absX = snap(dev.x + rotX);
      const absY = snap(dev.y + rotY);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', absX);
      circle.setAttribute('cy', absY);
      circle.setAttribute('r', '11');
      circle.setAttribute('fill', 'rgba(255, 140, 0, 0.35)');
      circle.setAttribute('stroke', '#ff8c00');
      circle.setAttribute('stroke-width', '2');
      circle.style.cursor = 'crosshair';

      circle.onclick = (e) => {
        e.stopPropagation();
        if (activeWirePoints.length === 0) {
          activeWirePoints.push({ x: absX, y: absY });
          render();
        } else {
          activeWirePoints.push({ x: absX, y: absY });
          finishCurrentWire();
        }
      };
      terminalsLayer.appendChild(circle);
    });
  }

  function showInspector(dev) {
    inspector.style.display = 'flex';
    document.getElementById('inspTitle').textContent = dev.name;

    const pipeTypes = ['pipe_pvc','pipe_upvc','pipe_emt','pipe_imc','pipe_flex','pipe_liquid','wireway','wire_duct'];
    const fittingTypes = ['elbow90','sweep_bend','elbow45','tee_pipe','cross_pipe','coupling','box_conn','clamp'];
    const isPipe = pipeTypes.includes(dev.type);
    const isFitting = fittingTypes.includes(dev.type);

    const hasAmp = ['main2p','rcbo2p','rcbo4p','rcbo1pn','mcb1p','mcb3p','spd','fuse','magnetic','overload'].includes(dev.type);
    const hasColor = ['pilot_lamp','push_btn','vinus_tag'].includes(dev.type);
    const hasSlots = ['din_rail','comb_busbar','bar_n','bar_g','box_frame'].includes(dev.type);

    document.getElementById('pipeSpecGroup').style.display = (isPipe || isFitting) ? 'flex' : 'none';
    document.getElementById('pipeLenBox').style.display = isPipe ? 'block' : 'none';
    document.getElementById('ampGroup').style.display = hasAmp ? 'block' : 'none';
    document.getElementById('colorGroup').style.display = hasColor ? 'block' : 'none';
    document.getElementById('widthGroup').style.display = hasSlots ? 'block' : 'none';

    if (isPipe || isFitting) {
      document.getElementById('pipeSizeSelect').value = dev.pipeSize || '4 หุน';
      document.getElementById('pipeLenInput').value = dev.pipeLen || 1;
      document.getElementById('pipeUnitSelect').value = dev.pipeUnit || 'เมตร';
    }
    if (hasAmp) document.getElementById('ampSelect').value = dev.amp;
    if (hasColor) document.getElementById('lampColorSelect').value = dev.color;
    if (hasSlots) document.getElementById('slotSelect').value = dev.slots;
    document.getElementById('labelInput').value = dev.label || '';
  }

  function closeInspector() {
    inspector.style.display = 'none';
    selectedDeviceId = null;
    render();
  }

  function updateDeviceProp(prop, val) {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev[prop] = val;
      saveData();
      render();
    }
  }

  function updatePipeLength() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev.pipeLen = parseFloat(document.getElementById('pipeLenInput').value) || 1;
      dev.pipeUnit = document.getElementById('pipeUnitSelect').value;
      saveData();
      render();
    }
  }

  function rotateSelected(deg) {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev.rot = ((dev.rot || 0) + deg) % 360;
      saveData();
      render();
    }
  }

  function toggleDeviceState() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev.isOn = !dev.isOn;
      saveData();
      render();
    }
  }

  function duplicateSelected() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      const copy = JSON.parse(JSON.stringify(dev));
      copy.id = 'dev_' + Date.now();
      copy.x += 40;
      copy.y += 40;
      devices.push(copy);
      selectedDeviceId = copy.id;
      showInspector(copy);
      saveData();
      render();
    }
  }

  function deleteSelected() {
    pushHistory();
    devices = devices.filter(d => d.id !== selectedDeviceId);
    closeInspector();
    saveData();
    render();
  }

  function clearAll() {
    if (confirm('ล้างอุปกรณ์และสายไฟทั้งหมดบนกระดาน?')) {
      pushHistory();
      devices = [];
      wires = [];
      activeWirePoints = [];
      closeInspector();
      saveData();
      render();
    }
  }

  function saveData() {
    localStorage.setItem('dear_panel_v4_devices', JSON.stringify(devices));
    localStorage.setItem('dear_panel_v4_wires', JSON.stringify(wires));
  }

  function loadData() {
    const savedDev = localStorage.getItem('dear_panel_v4_devices');
    const savedWires = localStorage.getItem('dear_panel_v4_wires');
    if (savedDev) {
      devices = JSON.parse(savedDev);
      wires = savedWires ? JSON.parse(savedWires) : [];
    } else {
      devices = [
        { id: 'd1', type: 'din_rail', name: 'รางปีกนก DIN', x: 80, y: 200, slots: 10 },
        { id: 'd2', type: 'rcbo2p', name: 'กันดูด RCBO 2P', x: 120, y: 140, amp: 'C63', isOn: true, label: 'เมนตู้บ่อปลา' },
        { id: 'd3', type: 'mcb1p', name: 'ลูกย่อย 1P', x: 220, y: 140, amp: 'C32', isOn: true, label: 'ปั๊ม' },
        { id: 'd4', type: 'mcb1p', name: 'ลูกย่อย 1P', x: 260, y: 140, amp: 'C32', isOn: true, label: 'ฮีตเตอร์' },
        { id: 'd5', type: 'pipe_pvc', name: 'ท่อ PVC เหลือง', x: 80, y: 360, pipeSize: '4 หุน', pipeLen: 1.5, pipeUnit: 'เมตร' }
      ];
    }
  }

  initUI();
  loadData();
  updateHistoryButtons();
  render();
</script>
</body>
</html>
