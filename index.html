<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Studio Pro - คุณเดียร์</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100dvh; /* แก้ปัญหาล้นจอบน Chrome มือถือ/แท็บเล็ต */
      background-color: #101216;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* แถบเครื่องมือด้านบน */
    .topbar {
      background: #181b20; padding: 6px 12px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2b303b; z-index: 30; gap: 6px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 6px; }
    .brand h1 { font-size: 14px; margin: 0; color: #ff8c00; white-space: nowrap; }
    .tools { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .btn {
      background: #252a34; color: #e2e8f0; border: 1px solid #3a4150;
      padding: 5px 9px; border-radius: 6px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.active { border-color: #ff8c00; background: #3b2a1a; color: #ff8c00; font-weight: bold; }
    .btn-success { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
    .btn-danger { background: #4a1c1c; border-color: #7f2d2d; color: #fca5a5; }
    .color-dot {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid #444; cursor: pointer; flex-shrink: 0;
    }
    .color-dot.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 6px rgba(255,255,255,0.6); }

    /* แถบแจ้งเตือนสถานะการเดินสาย */
    .wire-banner {
      background: #2b1d0e; border-bottom: 1px solid #ff8c00; color: #fdba74;
      padding: 5px 12px; font-size: 12px; display: none;
      justify-content: space-between; align-items: center; z-index: 25; flex-shrink: 0;
    }

    /* พื้นที่กระดานกริด */
    .workspace {
      flex: 1; position: relative; overflow: auto;
      background-color: #12151a;
      background-image: 
        linear-gradient(to right, #1c2028 1px, transparent 1px),
        linear-gradient(to bottom, #1c2028 1px, transparent 1px),
        linear-gradient(to right, #242933 1px, transparent 1px),
        linear-gradient(to bottom, #242933 1px, transparent 1px);
      background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    }
    svg#canvas { width: 2200px; height: 1600px; display: block; }

    /* เมนูลอยตั้งค่าอุปกรณ์ที่เลือก */
    .inspector {
      position: fixed; top: 52px; right: 12px;
      background: #1a1e24; border: 1px solid #ff8c00; border-radius: 10px;
      padding: 10px; display: none; flex-direction: column; gap: 7px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 40; width: 205px;
    }
    .inspector-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: bold; color: #ff8c00; border-bottom: 1px solid #2e3440; padding-bottom: 5px;
    }
    .inspector label { font-size: 11px; color: #94a3b8; }
    .inspector select, .inspector input, .inspector button {
      padding: 5px 8px; border-radius: 5px; background: #262b36; color: #fff;
      border: 1px solid #3f4756; font-size: 12px; width: 100%;
    }
    .inspector .row-btns { display: flex; gap: 5px; }

    /* แถบหมวดหมู่และคลังอุปกรณ์ด้านล่าง */
    .bottom-panel {
      background: #181b20; border-top: 1px solid #2b303b; z-index: 30;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .cat-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #14171c; border-bottom: 1px solid #2b303b; padding: 4px 8px 0;
    }
    .cat-tabs {
      display: flex; gap: 4px; overflow-x: auto; flex: 1;
    }
    .cat-tab {
      padding: 5px 10px; font-size: 12px; color: #94a3b8; cursor: pointer;
      border-radius: 6px 6px 0 0; white-space: nowrap; border: 1px solid transparent;
    }
    .cat-tab.active {
      background: #181b20; color: #ff8c00; font-weight: bold;
      border-color: #2b303b; border-bottom-color: #181b20;
    }
    .dock {
      padding: 8px 10px; display: flex; gap: 8px; overflow-x: auto; align-items: center; height: 74px;
    }
    .dock.collapsed { display: none; }
    .dock-item {
      background: #222730; border: 1px solid #353c49; border-radius: 8px;
      padding: 6px 10px; min-width: 90px; text-align: center; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .dock-item:active { background: #313846; border-color: #ff8c00; transform: scale(0.95); }
    .dock-item .icon { font-size: 18px; line-height: 1.1; }
    .dock-item span { font-size: 11px; color: #cbd5e1; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <h1>⚡ Panel Studio</h1>
      <button id="undoBtn" class="btn" onclick="undo()" title="ย้อนกลับ">↩️ ย้อนกลับ</button>
      <button id="redoBtn" class="btn" onclick="redo()" title="ทำซ้ำ">↪️</button>
    </div>
    <div class="tools">
      <button id="modeSelect" class="btn active" onclick="setMode('select')">✋ ย้าย/เลือก</button>
      <button id="modeWire" class="btn" onclick="setMode('wire')">〰️ เดินสายอิสระ</button>
      <div class="color-dot selected" style="background:#8B4513;" title="L (น้ำตาล)" onclick="setWireColor('#8B4513', this)"></div>
      <div class="color-dot" style="background:#1E90FF;" title="N (ฟ้า)" onclick="setWireColor('#1E90FF', this)"></div>
      <div class="color-dot" style="background:#2ecc71;" title="G (เขียว)" onclick="setWireColor('#2ecc71', this)"></div>
      <div class="color-dot" style="background:#e74c3c;" title="L1/Control (แดง)" onclick="setWireColor('#e74c3c', this)"></div>
      <div class="color-dot" style="background:#f1c40f;" title="L2 (เหลือง)" onclick="setWireColor('#f1c40f', this)"></div>
      <div class="color-dot" style="background:#111111; border-color:#777;" title="L3/COM (ดำ)" onclick="setWireColor('#111111', this)"></div>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ ล้าง</button>
    </div>
  </div>

  <!-- Wire Drawing Helper Banner -->
  <div id="wireBanner" class="wire-banner">
    <span>📍 โหมดเดินสายอิสระ: แตะจุดเริ่ม -> แตะมุมเลี้ยวบนกระดานได้เรื่อยๆ -> แตะหัวน็อตปลายทางเพื่อจบ</span>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-success" onclick="finishCurrentWire()">✅ จบเส้นนี้</button>
      <button class="btn btn-danger" onclick="cancelCurrentWire()">ยกเลิกเส้น</button>
    </div>
  </div>

  <!-- Inspector Menu -->
  <div id="inspector" class="inspector">
    <div class="inspector-header">
      <span id="inspTitle">ตั้งค่าอุปกรณ์</span>
      <span style="cursor:pointer; color:#94a3b8; padding:0 4px;" onclick="closeInspector()">✕</span>
    </div>

    <div id="ampGroup">
      <label>ขนาดแอมป์ / ค่าพิกัด:</label>
      <select id="ampSelect" onchange="updateDeviceProp('amp', this.value)">
        <option value="C100">C100 (100A)</option>
        <option value="C63">C63 (63A)</option>
        <option value="C50">C50 (50A)</option>
        <option value="C40">C40 (40A)</option>
        <option value="C32">C32 (32A)</option>
        <option value="C25">C25 (25A)</option>
        <option value="C20">C20 (20A)</option>
        <option value="C16">C16 (16A)</option>
        <option value="C10">C10 (10A)</option>
        <option value="C6">C6 (6A)</option>
      </select>
    </div>

    <div id="colorGroup" style="display:none;">
      <label>สีอุปกรณ์ / ปลอกไวนัส:</label>
      <select id="lampColorSelect" onchange="updateDeviceProp('color', this.value)">
        <option value="#2ecc71">สีเขียว (RUN / G)</option>
        <option value="#e74c3c">สีแดง (STOP / L1)</option>
        <option value="#facc15">สีเหลือง (WARN / ปลอกไวนัส)</option>
        <option value="#3498db">สีฟ้า (INFO / N)</option>
        <option value="#f8fafc">สีขาว (มาร์คสาย)</option>
      </select>
    </div>

    <div id="textGroup">
      <label>ข้อความป้าย / มาร์คสาย:</label>
      <input type="text" id="labelInput" placeholder="เช่น L1, ปั๊มบ่อ 1" oninput="updateDeviceProp('label', this.value)">
    </div>

    <div id="widthGroup" style="display:none;">
      <label>ความยาว (ช่อง / ระดับ):</label>
      <select id="slotSelect" onchange="updateDeviceProp('slots', parseInt(this.value))">
        <option value="2">2 หน่วย</option>
        <option value="4">4 หน่วย</option>
        <option value="6">6 หน่วย</option>
        <option value="8">8 หน่วย</option>
        <option value="12">12 หน่วย</option>
        <option value="16">16 หน่วย</option>
        <option value="20">20 หน่วย</option>
      </select>
    </div>

    <div class="row-btns">
      <button onclick="rotateSelected()">🔄 หมุน 90°</button>
      <button onclick="toggleDeviceState()">⚡ ON/OFF</button>
    </div>
    <div class="row-btns">
      <button onclick="duplicateSelected()">📋 คัดลอก</button>
      <button class="btn-danger" onclick="deleteSelected()">🗑️ ลบ</button>
    </div>
  </div>

  <!-- Main Grid Canvas -->
  <div class="workspace" id="workspace">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="pipes-layer"></g>
      <g id="rails-layer"></g>
      <g id="devices-layer"></g>
      <g id="wires-layer"></g>
      <g id="terminals-layer"></g>
    </svg>
  </div>

  <!-- Bottom Category & Component Dock -->
  <div class="bottom-panel">
    <div class="cat-bar">
      <div class="cat-tabs" id="catTabs"></div>
      <button class="btn" style="padding:3px 8px; margin-bottom:3px;" onclick="toggleDock()" id="dockToggleBtn">🔽 ซ่อนแถบ</button>
    </div>
    <div class="dock" id="componentDock"></div>
  </div>

<script>
  const GRID = 20;
  let mode = 'select';
  let wireColor = '#8B4513';
  let activeCategory = 'breakers';
  let devices = [];
  let wires = []; // เก็บเป็น { points: [{x,y}, {x,y}, ...], color }
  let selectedDeviceId = null;
  let selectedWireIdx = null;
  let activeWirePoints = []; // จุดระหว่างกำลังลากสายไฟอิสระ

  // ระบบ Undo / Redo
  let historyStack = [];
  let redoStack = [];

  const CATALOG = {
    breakers: {
      name: '⚡ เบรกเกอร์/กันดูด',
      items: [
        { type: 'main2p', name: 'เมนเบรกเกอร์ 2P', icon: '🔲', defaultAmp: 'C63' },
        { type: 'rcbo2p', name: 'กันดูด RCBO 2P', icon: '🛡️', defaultAmp: 'C63' },
        { type: 'rcbo1pn', name: 'กันดูด 1P+N', icon: '🔰', defaultAmp: 'C32' },
        { type: 'mcb1p', name: 'ลูกย่อย 1P', icon: '🔌', defaultAmp: 'C32' },
        { type: 'mcb3p', name: 'เบรกเกอร์ 3P', icon: '🎛️', defaultAmp: 'C32' },
        { type: 'fuse', name: 'ฟิวส์หลอด DIN', icon: '💊', defaultAmp: 'C10' }
      ]
    },
    pipes: {
      name: '🪠 ท่อ & รางไวร์เวย์',
      items: [
        { type: 'wireway', name: 'รางไวร์เวย์โปร่ง', icon: '🪜', defaultSlots: 8 },
        { type: 'pipe_pvc', name: 'ท่อ PVC เหลือง', icon: '📏', defaultSlots: 6 },
        { type: 'pipe_emt', name: 'ท่อ EMT โลหะ', icon: '🔩', defaultSlots: 6 },
        { type: 'pipe_flex', name: 'ท่ออ่อนลูกฟูก', icon: '〰️', defaultSlots: 4 },
        { type: 'elbow90', name: 'ข้องอ 90°', icon: '↪️' },
        { type: 'tee_pipe', name: 'สามทางแยกท่อ', icon: '⊥' },
        { type: 'junction_box', name: 'บ็อกซ์พักสาย', icon: ' квадрат' },
        { type: 'cable_gland', name: 'เคเบิลแกลนด์ PG', icon: '🗜️' }
      ]
    },
    rails: {
      name: '📏 ราง DIN & บัสบาร์',
      items: [
        { type: 'din_rail', name: 'รางปีกนก DIN', icon: '➖', defaultSlots: 12 },
        { type: 'comb_busbar', name: 'บัสบาร์หวี 1P', icon: '🔱', defaultSlots: 6 },
        { type: 'bar_n', name: 'บาร์นิวทรัล (N)', icon: '🔵', defaultSlots: 6 },
        { type: 'bar_g', name: 'บาร์กราวด์ (G)', icon: '🟢', defaultSlots: 6 },
        { type: 'terminal_block', name: 'เทอร์มินอล 4 ช่อง', icon: '🧱' },
        { type: 'terminal_strip', name: 'ลูกเต๋าต่อสาย 6P', icon: '🎲' }
      ]
    },
    control: {
      name: '⚙️ ตู้คอนโทรล/รีเลย์',
      items: [
        { type: 'magnetic', name: 'แมกเนติกคอนแทคเตอร์', icon: '🧲', defaultAmp: 'C32' },
        { type: 'overload', name: 'โอเวอร์โหลดรีเลย์', icon: '🌡️', defaultAmp: 'C16' },
        { type: 'timer', name: 'ไทม์เมอร์ตั้งเวลา', icon: '⏱️' },
        { type: 'relay8', name: 'รีเลย์ 8 ขา', icon: '📦' },
        { type: 'phase_prot', name: 'ป้องกันไฟตก/เกิน', icon: '📉' },
        { type: 'psu_12v', name: 'สวิตชิ่ง 12V/24V', icon: '🔋' }
      ]
    },
    panel_ui: {
      name: '🚦 หน้าตู้ & มิเตอร์',
      items: [
        { type: 'pilot_lamp', name: 'ไพลอตแลมป์', icon: '💡', defaultColor: '#2ecc71' },
        { type: 'push_btn', name: 'ปุ่มกด Push Button', icon: '🔘', defaultColor: '#2ecc71' },
        { type: 'emergency_btn', name: 'ปุ่มฉุกเฉิน E-Stop', icon: '🛑' },
        { type: 'selector', name: 'ซีเล็คเตอร์สวิตช์', icon: '🔄' },
        { type: 'digital_meter', name: 'ดิจิทัลโวลต์-แอมป์', icon: '📟' }
      ]
    },
    loads: {
      name: '💧 โหลด/ปลั๊ก/บ่อปลา',
      items: [
        { type: 'outlet_duplex', name: 'เต้ารับกราวด์คู่', icon: '🔌' },
        { type: 'wall_switch', name: 'สวิตช์ทางเดียว', icon: '🎚️' },
        { type: 'water_pump', name: 'ปั๊มน้ำ (Pump)', icon: '🌊' },
        { type: 'air_pump', name: 'ปั๊มลม (Air Pump)', icon: '🫧' },
        { type: 'heater', name: 'ฮีตเตอร์ (Heater)', icon: '🔥' },
        { type: 'float_switch', name: 'สวิตช์ลูกลอย', icon: '🎈' },
        { type: 'solenoid', name: 'โซลินอยด์วาล์ว', icon: '🚰' }
      ]
    },
    labels: {
      name: '🏷️ ไวนัส & ป้ายกำกับ',
      items: [
        { type: 'vinus_tag', name: 'ปลอกไวนัสมาร์คสาย', icon: '💊', defaultLabel: 'L1', defaultColor: '#facc15' },
        { type: 'label_tag', name: 'ป้ายชื่อวงจร', icon: '🏷️', defaultLabel: 'โซน 1' },
        { type: 'box_frame', name: 'กรอบตู้คอนโทรล', icon: '⬜', defaultSlots: 12 }
      ]
    }
  };

  const pipesLayer = document.getElementById('pipes-layer');
  const railsLayer = document.getElementById('rails-layer');
  const devicesLayer = document.getElementById('devices-layer');
  const wiresLayer = document.getElementById('wires-layer');
  const terminalsLayer = document.getElementById('terminals-layer');
  const inspector = document.getElementById('inspector');
  const canvas = document.getElementById('canvas');

  function pushHistory() {
    historyStack.push(JSON.stringify({ devices, wires }));
    if (historyStack.length > 40) historyStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function undo() {
    if (historyStack.length === 0) return;
    redoStack.push(JSON.stringify({ devices, wires }));
    const prev = JSON.parse(historyStack.pop());
    devices = prev.devices;
    wires = prev.wires;
    closeInspector();
    saveData();
    render();
    updateHistoryButtons();
  }

  function redo() {
    if (redoStack.length === 0) return;
    historyStack.push(JSON.stringify({ devices, wires }));
    const next = JSON.parse(redoStack.pop());
    devices = next.devices;
    wires = next.wires;
    closeInspector();
    saveData();
    render();
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = historyStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }

  function initUI() {
    const catTabs = document.getElementById('catTabs');
    catTabs.innerHTML = '';
    Object.keys(CATALOG).forEach(key => {
      const tab = document.createElement('div');
      tab.className = 'cat-tab' + (key === activeCategory ? ' active' : '');
      tab.textContent = CATALOG[key].name;
      tab.onclick = () => {
        activeCategory = key;
        document.getElementById('componentDock').classList.remove('collapsed');
        document.getElementById('dockToggleBtn').textContent = '🔽 ซ่อนแถบ';
        initUI();
      };
      catTabs.appendChild(tab);
    });

    const dock = document.getElementById('componentDock');
    dock.innerHTML = '';
    CATALOG[activeCategory].items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'dock-item';
      const iconStr = item.icon.trim().length > 3 ? '📦' : item.icon;
      card.innerHTML = `<div class="icon">${iconStr}</div><span>${item.name}</span>`;
      card.onclick = () => addDevice(item);
      dock.appendChild(card);
    });
  }

  function toggleDock() {
    const dock = document.getElementById('componentDock');
    const btn = document.getElementById('dockToggleBtn');
    const isHidden = dock.classList.toggle('collapsed');
    btn.textContent = isHidden ? '🔼 เปิดคลัง' : '🔽 ซ่อนแถบ';
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('modeSelect').classList.toggle('active', mode === 'select');
    document.getElementById('modeWire').classList.toggle('active', mode === 'wire');
    document.getElementById('wireBanner').style.display = mode === 'wire' ? 'flex' : 'none';
    activeWirePoints = [];
    selectedWireIdx = null;
    if (mode === 'wire') closeInspector();
    render();
  }

  function setWireColor(color, el) {
    wireColor = color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
  }

  function snap(val) { return Math.round(val / GRID) * GRID; }

  // แตะบนกระดานว่างเพื่อเพิ่มจุดหักมุมสายไฟ หรือยกเลิกการเลือก
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = snap(e.clientX - rect.left);
    const clickY = snap(e.clientY - rect.top);

    if (mode === 'wire') {
      activeWirePoints.push({ x: clickX, y: clickY });
      render();
    } else {
      if (e.target.id === 'canvas') {
        closeInspector();
        selectedWireIdx = null;
        render();
      }
    }
  });

  function finishCurrentWire() {
    if (activeWirePoints.length >= 2) {
      pushHistory();
      wires.push({ points: [...activeWirePoints], color: wireColor });
      saveData();
    }
    activeWirePoints = [];
    render();
  }

  function cancelCurrentWire() {
    activeWirePoints = [];
    render();
  }

  function addDevice(itemSpec) {
    pushHistory();
    const ws = document.getElementById('workspace');
    const spawnX = snap(ws.scrollLeft + 100 + (devices.length % 5) * 40);
    const spawnY = snap(ws.scrollTop + 100 + (devices.length % 4) * 40);

    const newDev = {
      id: 'dev_' + Date.now() + Math.random().toString(36).substr(2, 4),
      type: itemSpec.type,
      name: itemSpec.name,
      x: spawnX,
      y: spawnY,
      rot: 0,
      amp: itemSpec.defaultAmp || 'C32',
      color: itemSpec.defaultColor || '#2ecc71',
      slots: itemSpec.defaultSlots || 6,
      label: itemSpec.defaultLabel || '',
      isOn: true
    };
    devices.push(newDev);
    selectedDeviceId = newDev.id;
    showInspector(newDev);
    saveData();
    render();
  }

  function render() {
    pipesLayer.innerHTML = '';
    railsLayer.innerHTML = '';
    devicesLayer.innerHTML = '';
    terminalsLayer.innerHTML = '';
    wiresLayer.innerHTML = '';

    // 1. วาดสายไฟที่เดินเสร็จแล้วทั้งหมด
    wires.forEach((w, idx) => {
      if (!w.points || w.points.length < 2) return;
      const d = w.points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const isWireSelected = selectedWireIdx === idx;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', isWireSelected ? '#ff8c00' : w.color);
      path.setAttribute('stroke-width', isWireSelected ? '7' : '5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('fill', 'none');
      path.style.cursor = 'pointer';

      path.onclick = (e) => {
        e.stopPropagation();
        if (mode === 'select') {
          selectedWireIdx = idx;
          closeInspector();
          render();
        }
      };
      wiresLayer.appendChild(path);

      // ถ้าเลือกเส้นสายไฟอยู่ ให้แสดงปุ่มลบและจุดดึงมุมสายไฟอิสระ
      if (isWireSelected && mode === 'select') {
        w.points.forEach((pt, pIdx) => {
          const handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          handle.setAttribute('cx', pt.x);
          handle.setAttribute('cy', pt.y);
          handle.setAttribute('r', '9');
          handle.setAttribute('fill', '#ff8c00');
          handle.setAttribute('stroke', '#fff');
          handle.setAttribute('stroke-width', '2');
          handle.style.cursor = 'move';
          setupWireNodeDrag(handle, w, pIdx);
          terminalsLayer.appendChild(handle);
        });

        // ปุ่มกากบาทลบเส้นสายไฟตรงกึ่งกลางเส้น
        const midPt = w.points[Math.floor(w.points.length / 2)];
        const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        delBtn.setAttribute('transform', `translate(${midPt.x}, ${midPt.y - 22})`);
        delBtn.style.cursor = 'pointer';
        delBtn.innerHTML = `
          <rect x="-24" y="-12" width="48" height="22" rx="4" fill="#dc2626" stroke="#fff"/>
          <text x="0" y="3" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ลบสาย</text>
        `;
        delBtn.onclick = (e) => {
          e.stopPropagation();
          pushHistory();
          wires.splice(idx, 1);
          selectedWireIdx = null;
          saveData();
          render();
        };
        terminalsLayer.appendChild(delBtn);
      }
    });

    // 2. วาดเส้นสายไฟที่กำลังลากอยู่ (Preview)
    if (activeWirePoints.length > 0) {
      const d = activeWirePoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const preview = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      preview.setAttribute('d', d);
      preview.setAttribute('stroke', wireColor);
      preview.setAttribute('stroke-width', '5');
      preview.setAttribute('stroke-dasharray', '8,6');
      preview.setAttribute('fill', 'none');

        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');

        dot.setAttribute('cy', pt.y);

            <rect x="0" y="0" width="100" height="60" rx="6" fill="#f8fafc" stroke="${stroke}" stroke-width="${sw}"/>
            <circle cx="28" cy="30" r="16" fill="#e2e8f0" stroke="#94a3b8"/>
            <rect x="21" y="22" width="4" height="10" fill="#0f172a"/><rect x="31" y="22" width="4" height="10" fill="#0f172a"/>
            <circle cx="28" cy="38" r="3" fill="#0f172a"/>
            <circle cx="72" cy="30" r="16" fill="#e2e8f0" stroke="#94a3b8"/>
            <rect x="65" y="22" width="4" height="10" fill="#0f172a"/><rect x="75" y="22" width="4" height="10" fill="#0f172a"/>
            <circle cx="72" cy="38" r="3" fill="#0f172a"/>
            ${drawScrew(20, -12)} ${drawScrew(50, -12)} ${drawScrew(80, -12)}
            ${drawBadge(50, 74, dev.label)}
          `;
          pins = [{dx:20,dy:-12},{dx:50,dy:-12},{dx:80,dy:-12}];
          break;
        }
        case 'wall_switch': {
          g.innerHTML = `
            <rect x="0" y="0" width="60" height="80" rx="6" fill="#f8fafc" stroke="${stroke}" stroke-width="${sw}"/>
            <rect x="18" y="18" width="24" height="44" rx="3" fill="${dev.isOn ? '#cbd5e1' : '#94a3b8'}" stroke="#64748b"/>
            ${drawScrew(20, -12)} ${drawScrew(40, -12)}
            ${drawBadge(30, 94, dev.label)}
          `;
          pins = [{dx:20,dy:-12},{dx:40,dy:-12}];
          break;
        }
        case 'water_pump':
        case 'air_pump':
        case 'heater':
        case 'float_switch':
        case 'solenoid': {
          const map = {
            water_pump: { bg: '#0284c7', title: '💧 ปั๊มน้ำ' },
            air_pump: { bg: '#0d9488', title: '🫧 ปั๊มลม' },
            heater: { bg: '#dc2626', title: '🔥 ฮีตเตอร์' },
            float_switch: { bg: '#d97706', title: '🎈 ลูกลอย' },
            solenoid: { bg: '#4f46e5', title: '🚰 โซลินอยด์' }
          };
          const info = map[dev.type];
          g.innerHTML = `
            <rect x="0" y="0" width="110" height="60" rx="10" fill="${info.bg}" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="55" y="28" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">${info.title}</text>
            <text x="55" y="46" fill="#e0f2fe" font-size="11" text-anchor="middle">${dev.label || '220V'}</text>
            ${drawScrew(35, -12)} ${drawScrew(75, -12)}
          `;
          pins = [{dx:35,dy:-12},{dx:75,dy:-12}];
          break;
        }

        // --- หมวดไวนัส & ป้ายกำกับ ---
        case 'vinus_tag': {
          const text = dev.label || 'L1';
          const bg = dev.color || '#facc15';
          const textColor = ['#111111', '#e74c3c', '#3498db', '#2ecc71'].includes(bg) ? '#fff' : '#000';
          g.innerHTML = `
            <rect x="0" y="0" width="34" height="22" rx="4" fill="${bg}" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="17" y="15" fill="${textColor}" font-size="11" font-weight="bold" text-anchor="middle">${text}</text>
          `;
          break;
        }
        case 'label_tag': {
          const text = dev.label || 'ป้ายชื่อวงจร';
          const w = Math.max(80, text.length * 10 + 24);
          g.innerHTML = `
            <rect x="0" y="0" width="${w}" height="28" rx="4" fill="#facc15" stroke="${stroke}" stroke-width="${sw}"/>
            <text x="${w/2}" y="19" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">${text}</text>
          `;
          break;
        }
      }

      createTerminalPoints(dev, pins);
      setupDrag(g, dev);
      targetLayer.appendChild(g);
    });
  }

  function drawScrew(cx, cy) {
    return `
      <circle cx="${cx}" cy="${cy}" r="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <line x1="${cx-3.5}" y1="${cy-3.5}" x2="${cx+3.5}" y2="${cy+3.5}" stroke="#334155" stroke-width="1.8"/>
      <line x1="${cx+3.5}" y1="${cy-3.5}" x2="${cx-3.5}" y2="${cy+3.5}" stroke="#334155" stroke-width="1.8"/>
    `;
  }

  function drawBadge(cx, cy, text) {
    if (!text) return '';
    const w = text.length * 8 + 14;
    return `
      <rect x="${cx - w/2}" y="${cy - 11}" width="${w}" height="16" rx="3" fill="#facc15"/>
      <text x="${cx}" y="${cy + 1}" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">${text}</text>
    `;
  }

  function createTerminalPoints(dev, points) {
    if (mode !== 'wire') return;
    const rad = ((dev.rot || 0) * Math.PI) / 180;
    points.forEach(pt => {
      // คำนวณพิกัดจริงหลังการหมุนอุปกรณ์
      const rotX = pt.dx * Math.cos(rad) - pt.dy * Math.sin(rad);
      const rotY = pt.dx * Math.sin(rad) + pt.dy * Math.cos(rad);
      const absX = snap(dev.x + rotX);
      const absY = snap(dev.y + rotY);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', absX);
      circle.setAttribute('cy', absY);
      circle.setAttribute('r', '11');
      circle.setAttribute('fill', 'rgba(255, 140, 0, 0.35)');
      circle.setAttribute('stroke', '#ff8c00');
      circle.setAttribute('stroke-width', '2');
      circle.style.cursor = 'crosshair';

      circle.onclick = (e) => {
        e.stopPropagation();
        if (activeWirePoints.length === 0) {
          // เริ่มต้นสายไฟจากหัวน็อตนี้
          activeWirePoints.push({ x: absX, y: absY });
          render();
        } else {
          // จบสายไฟที่หัวน็อตปลายทางทันที
          activeWirePoints.push({ x: absX, y: absY });
          finishCurrentWire();
        }
      };
      terminalsLayer.appendChild(circle);
    });
  }

  function setupWireNodeDrag(el, wireObj, pointIndex) {
    let isDragging = false;
    const onStart = (e) => {
      e.stopPropagation();
      isDragging = true;
      pushHistory();
    };
    const onMove = (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      wireObj.points[pointIndex].x = snap(clientX - rect.left);
      wireObj.points[pointIndex].y = snap(clientY - rect.top);
      render();
    };
    const onEnd = () => {
      if (isDragging) {
        isDragging = false;
        saveData();
      }
    };
    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
  }

  function setupDrag(el, dev) {
    let isDragging = false;
    let moved = false;
    let startX, startY, origX, origY;

    const onStart = (e) => {
      if (mode !== 'select') return;
      e.stopPropagation();
      isDragging = true;
      moved = false;
      selectedDeviceId = dev.id;
      selectedWireIdx = null;
      showInspector(dev);

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX; startY = clientY;
      origX = dev.x; origY = dev.y;
      render();
    };

    const onMove = (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      if (!moved && (Math.abs(clientX - startX) > 4 || Math.abs(clientY - startY) > 4)) {
        moved = true;
        pushHistory();
      }
      if (moved) {
        dev.x = Math.max(0, snap(origX + (clientX - startX)));
        dev.y = Math.max(0, snap(origY + (clientY - startY)));
        render();
      }
    };

    const onEnd = () => {
      if (isDragging) {
        isDragging = false;
        if (moved) saveData();
      }
    };

    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
  }

  function showInspector(dev) {
    inspector.style.display = 'flex';
    document.getElementById('inspTitle').textContent = dev.name;

    const hasAmp = ['main2p','rcbo2p','rcbo1pn','mcb1p','mcb3p','fuse','magnetic','overload'].includes(dev.type);
    const hasColor = ['pilot_lamp','push_btn','vinus_tag'].includes(dev.type);
    const hasSlots = ['din_rail','comb_busbar','bar_n','bar_g','box_frame','wireway','pipe_pvc','pipe_emt','pipe_flex'].includes(dev.type);

    document.getElementById('ampGroup').style.display = hasAmp ? 'block' : 'none';
    document.getElementById('colorGroup').style.display = hasColor ? 'block' : 'none';
    document.getElementById('widthGroup').style.display = hasSlots ? 'block' : 'none';

    if (hasAmp) document.getElementById('ampSelect').value = dev.amp;
    if (hasColor) document.getElementById('lampColorSelect').value = dev.color;
    if (hasSlots) document.getElementById('slotSelect').value = dev.slots;
    document.getElementById('labelInput').value = dev.label || '';
  }

  function closeInspector() {
    inspector.style.display = 'none';
    selectedDeviceId = null;
    render();
  }

  function updateDeviceProp(prop, val) {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev[prop] = val;
      saveData();
      render();
    }
  }

  function rotateSelected() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev.rot = ((dev.rot || 0) + 90) % 360;
      saveData();
      render();
    }
  }

  function toggleDeviceState() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      dev.isOn = !dev.isOn;
      saveData();
      render();
    }
  }

  function duplicateSelected() {
    const dev = devices.find(d => d.id === selectedDeviceId);
    if (dev) {
      pushHistory();
      const copy = JSON.parse(JSON.stringify(dev));
      copy.id = 'dev_' + Date.now();
      copy.x += 40;
      copy.y += 40;
      devices.push(copy);
      selectedDeviceId = copy.id;
      showInspector(copy);
      saveData();
      render();
    }
  }

  function deleteSelected() {
    pushHistory();
    devices = devices.filter(d => d.id !== selectedDeviceId);
    closeInspector();
    saveData();
    render();
  }

  function clearAll() {
    if (confirm('ล้างอุปกรณ์และสายไฟทั้งหมดบนกระดาน?')) {
      pushHistory();
      devices = [];
      wires = [];
      activeWirePoints = [];
      closeInspector();
      saveData();
      render();
    }
  }

  function saveData() {
    localStorage.setItem('dear_panel_v2_devices', JSON.stringify(devices));
    localStorage.setItem('dear_panel_v2_wires', JSON.stringify(wires));
  }

  function loadData() {
    const savedDev = localStorage.getItem('dear_panel_v2_devices');
    const savedWires = localStorage.getItem('dear_panel_v2_wires');
    if (savedDev) {
      devices = JSON.parse(savedDev);
      wires = savedWires ? JSON.parse(savedWires) : [];
    } else {
      devices = [
        { id: 'd1', type: 'din_rail', name: 'รางปีกนก DIN', x: 80, y: 200, slots: 10 },
        { id: 'd2', type: 'rcbo2p', name: 'กันดูด RCBO 2P', x: 120, y: 140, amp: 'C63', isOn: true, label: 'เมนตู้บ่อปลา' },
        { id: 'd3', type: 'mcb1p', name: 'ลูกย่อย 1P', x: 220, y: 140, amp: 'C32', isOn: true, label: 'ปั๊ม' },
        { id: 'd4', type: 'mcb1p', name: 'ลูกย่อย 1P', x: 260, y: 140, amp: 'C32', isOn: true, label: 'ฮีตเตอร์' }
      ];
    }
  }

  initUI();
  loadData();
  updateHistoryButtons();
  render();
</script>
</body>
